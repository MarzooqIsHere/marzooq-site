# Admin page for marzooq.co.uk (Sveltia CMS).
# Sign in at https://marzooq.co.uk/admin/ with "Sign in with Token" (see SETUP.md).

backend:
  name: github
  repo: MarzooqIsHere/marzooq-site   # <- change to your GitHub username / repo name
  branch: main

media_folder: marzooq-site/src/images/uploads
public_folder: /images/uploads

collections:
  - name: content
    label: Site content
    files:

      - name: now
        label: Now
        file: marzooq-site/src/_data/now.json
        fields:
          - { name: updated, label: "Updated (e.g. November 2026)", widget: string }
          - name: items
            label: What I'm doing right now
            widget: list
            field: { name: item, label: Item, widget: string }

      - name: photos
        label: Photography
        file: marzooq-site/src/_data/photos.json
        fields:
          - name: personal
            label: Personal work
            hint: "Drag to reorder. Tick 'Show on homepage' on up to three photos."
            widget: list
            fields:
              - { name: image, label: Photo, widget: image }
              - { name: caption, label: Caption (place), widget: string, required: false }
              - { name: alt, label: "Description (for screen readers and Google)", widget: string, required: false }
              - { name: location, label: "Location (click the map to drop a pin)", widget: map, type: Point, required: false }
              - { name: featured, label: Show on homepage, widget: boolean, default: false }
          - name: commissions
            label: Commissions
            widget: list
            fields:
              - { name: image, label: Photo, widget: image }
              - { name: caption, label: Caption, widget: string, required: false }
              - { name: alt, label: "Description (for screen readers and Google)", widget: string, required: false }

      - name: writing
        label: Featured writing
        file: marzooq-site/src/_data/writing.json
        fields:
          - name: featured
            label: Featured essays
            hint: "Paste the Substack link. Title and cover image are pulled from Substack automatically. Leave the list empty to show your three latest posts."
            widget: list
            fields:
              - { name: url, label: Substack link, widget: string }
              - { name: blurb, label: "Blurb (optional, replaces the Substack subtitle)", widget: string, required: false }

      - name: links
        label: Links
        file: marzooq-site/src/_data/links.json
        fields:
          - { name: spotify, label: "Spotify playlist or profile link (shows a music icon in the footer; leave empty to hide)", widget: string, required: false }

      - name: kit
        label: Kit (photography page)
        file: marzooq-site/src/_data/kit.json
        fields:
          - name: items
            label: Lines
            widget: list
            summary: "{{fields.label}}: {{fields.value}}"
            fields:
              - { name: label, label: "Label (e.g. Camera)", widget: string }
              - { name: value, label: Text, widget: string }

      - name: shelf
        label: Shelf
        file: marzooq-site/src/_data/shelf.json
        fields:
          - { name: intro, label: Intro line, widget: string }
          - name: books
            label: Books
            hint: "Drag to reorder within a group. Covers are found automatically from Open Library; upload your own photo to replace one, or add an ISBN if it picks the wrong edition."
            widget: list
            summary: "{{fields.title}} ({{fields.group}})"
            fields:
              - { name: title, label: Title, widget: string }
              - { name: author, label: Author, widget: string, required: false }
              - name: group
                label: Group
                widget: select
                options:
                  - { label: "Philosophy and faith", value: faith }
                  - { label: "Politics and power", value: politics }
                  - { label: "Stories and wonder", value: stories }
              - { name: reading, label: "Reading it now (shows a 'Reading now' tag)", widget: boolean, default: false, required: false }
              - { name: note, label: "Why it's here (one line, shown on the back cover)", widget: text, required: false }
              - { name: spine, label: "Spine colour (optional, e.g. #22382C; otherwise taken from the cover)", widget: string, required: false }
              - { name: cover, label: "Cover (optional, your own photo)", widget: image, required: false }
              - { name: olcover, label: "Open Library cover ID (optional, picks an exact cover)", widget: string, required: false }
              - { name: isbn, label: "ISBN (optional, to pick a specific edition's cover)", widget: string, required: false }
              - { name: lookup, label: "Find cover automatically", widget: boolean, default: true, required: false }

      - name: cv
        label: CV
        file: marzooq-site/src/_data/cv.json
        fields:
          - { name: pdf, label: CV PDF, widget: file, media_folder: /marzooq-site/src/files, public_folder: /files }
          - name: sections
            label: Sections
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { name: id, label: "Section ID (one word, lowercase)", widget: string }
              - { name: title, label: Section title, widget: string }
              - { name: title_cy, label: Section title in Welsh, widget: string, required: false }
              - name: entries
                label: Entries
                widget: list
                summary: "{{fields.title}}, {{fields.org}}"
                fields:
                  - { name: title, label: Job title / role, widget: string }
                  - { name: org, label: Organisation, widget: string, required: false }
                  - { name: dates, label: "Dates (e.g. October 2026 – Present)", widget: string, required: false }
                  - { name: sub, label: "Extra line (optional, e.g. previous role or branches)", widget: string, required: false }
                  - { name: current, label: "Current (shows under 'Right now')", widget: boolean, default: false }
                  - name: bullets
                    label: Bullet points
                    widget: list
                    required: false
                    field: { name: bullet, label: Bullet, widget: text }
