name: Cover sheets (temporary)
on:
  push:
    branches: [covers-tmp]
    paths: [tools/**, .github/workflows/cover-sheets.yml]
permissions:
  contents: write
jobs:
  sheets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pillow && python tools/cover_sheets.py
      - run: |
          git config user.name "cover-sheets" && git config user.email "actions@github.com"
          git add out && git commit -m "Cover sheets" && git push
